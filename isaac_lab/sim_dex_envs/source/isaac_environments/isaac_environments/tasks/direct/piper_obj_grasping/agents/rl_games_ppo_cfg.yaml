seed: 42

train:
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: PiperCSVExecuteStackCube
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    num_actors: 1  # Single environment for CSV execution
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 10000
    max_epochs: 1000
    save_best_after: 10
    save_frequency: 25
    print_stats: True
    grad_norm: 1.0
    entropy_coeff: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 1000  # Long horizon for CSV execution
    minibatch_size: 1024
    mini_epochs: 8
    critic_coeff: 4.0
    clip_value: True
    seq_len: 4
    bounds_loss_coeff: 0.0001